[package]
name = "dicomtg-core"
version = "3.4.0"
edition = "2024"
publish = false

[dependencies]
csv = "1"
flate2 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
ureq = "3"

